id: doa_uca_pilot_calibration
label: UCA OTA Pilot Calibration
category: '[doa]'

templates:
  imports: from gnuradio import doa
  make: |-
    doa.uca_pilot_calibration(
        num_inputs=${num_inputs},
        norm_radius=${norm_radius},
        pilot_angle=${pilot_angle},
        element0_angle=${element0_angle},
        element_angle_step=${element_angle_step},
        skip_samples=${skip_samples},
        calibration_samples=${calibration_samples},
        config_filename=${config_filename},
        min_coherence=${min_coherence},
        start_tag_key=${start_tag_key},
        separate_data_inputs=${separate_data_inputs},
        retry_on_failure=${retry_on_failure})

parameters:
- id: num_inputs
  label: Number of Elements
  dtype: int
  default: 4
- id: norm_radius
  label: Normalized Radius (r/lambda)
  dtype: float
  default: 0.34638
- id: pilot_angle
  label: Pilot Source Bearing (deg)
  dtype: float
  default: 0.0
- id: element0_angle
  label: Element 0 Bearing (deg)
  dtype: float
  default: 0.0
- id: element_angle_step
  label: Element Bearing Step (deg)
  dtype: float
  default: 90.0
- id: skip_samples
  label: Initial Samples to Skip
  dtype: int
  default: 8192
- id: calibration_samples
  label: Pilot Samples to Average
  dtype: int
  default: 32768
- id: config_filename
  label: Coefficient Log File (optional)
  dtype: file_save
  default: "''"
- id: min_coherence
  label: Minimum Valid Coherence
  dtype: float
  default: 0.90
- id: start_tag_key
  label: Required Start Tag (optional)
  dtype: string
  default: "''"
- id: separate_data_inputs
  label: Separate Target Inputs
  dtype: bool
  default: 'False'
- id: retry_on_failure
  label: Retry Failed Calibration Window
  dtype: bool
  default: 'False'

asserts:
- ${ num_inputs > 1 }
- ${ norm_radius > 0.0 }
- ${ skip_samples >= 0 }
- ${ calibration_samples > 0 }
- ${ min_coherence >= 0.0 and min_coherence <= 1.0 }

inputs:
- label: pilot
  domain: stream
  dtype: complex
  multiplicity: ${ num_inputs }
- label: target
  domain: stream
  dtype: complex
  multiplicity: ${ num_inputs }
  optional: true

outputs:
- label: corrected
  domain: stream
  dtype: complex
  multiplicity: ${ num_inputs }

documentation: |-
  Same-session OTA phase calibration for a uniform circular array.

  pilot_angle is the SOURCE bearing from the array centre towards the pilot
  transmitter. The block uses the same source-bearing UCA manifold as MUSIC:
  exp(+j*2*pi*(r/lambda)*cos(theta-beta_m)).

  Place a strong narrowband pilot at the configured known bearing before the
  flowgraph starts. The block removes the predicted UCA steering phase from the
  measured pilot-channel ratios and freezes one unit-magnitude phase correction
  per channel. With Separate Target Inputs disabled it applies those coefficients
  to the pilot inputs for backwards compatibility. With Separate Target Inputs
  enabled, the first input group is used only to estimate calibration and the
  second group is passed through the frozen coefficients for direction finding.
  It emits zeros during the skip/calibration interval. Channel amplitudes are
  intentionally left unchanged, matching Ettus's relative phase-correction stage.

  The console also prints normalized complex coherence for every channel relative
  to channel 0. Values close to 1 are expected for a clean stationary pilot; a
  low value means the phase correction and MUSIC result should not be trusted.
  If any non-reference channel is below min_coherence (0.90 by default), the
  block prints an explicit CALIBRATION FAILED state, does not save coefficients,
  and switches to unity/bypass output so invalid phase estimates are never frozen.
  With Retry Failed Calibration Window enabled, it instead discards the failed
  window, repeats the configured skip interval, and keeps output muted until a
  coherent calibration window succeeds. This is useful when a continuously
  locked tracker may cross a brief frequency-state transition during collection.

  Keep both IIO sources and this flowgraph running after calibration. Reopening
  or retuning either LibreSDR can invalidate the corrections. When a log filename
  is supplied, the saved radians are directly compatible with Ettus's Phase
  Correct Chains block (channel 0 is the reference and is omitted).

  When Required Start Tag is non-empty, this block emits zeros and does not
  count its skip or calibration samples until that tag arrives on input 0. Use
  cfo_locked after a Cross-SDR CFO Corrector so constant phase calibration can
  never begin before a valid CFO correction is tracking. A cfo_unlocked tag
  discards partial or frozen calibration state and silences output; a later
  cfo_locked tag restarts the complete skip/calibration interval.

  Compute norm_radius at the actual pilot RF frequency. A pure tone corrects fixed
  delay only at that tone frequency; this block is
  intended for narrowband MUSIC and is not a wideband sample synchronizer.

file_format: 1
