id: doa_cross_sdr_cfo_corrector
label: Cross-SDR CFO Corrector
category: '[doa]'

templates:
  imports: from gnuradio import doa
  make: |-
    doa.cross_sdr_cfo_corrector(
        samp_rate=${samp_rate},
        pilot_offset_hz=${pilot_offset_hz},
        pilot_bandwidth_hz=${pilot_bandwidth_hz},
        settling_samples=${settling_samples},
        estimation_samples=${estimation_samples},
        validation_settling_samples=${validation_settling_samples},
        residual_tolerance_hz=${residual_tolerance_hz},
        max_refinement_rounds=${max_refinement_rounds},
        retry_delay_samples=${retry_delay_samples},
        agreement_tolerance_hz=${agreement_tolerance_hz},
        max_abs_cfo_hz=${max_abs_cfo_hz},
        min_coherence=${min_coherence},
        tracking_window_samples=${tracking_window_samples},
        tracking_phase_gain=${tracking_phase_gain},
        phase_jump_threshold_rad=${phase_jump_threshold_rad},
        tracking_bad_window_grace=${tracking_bad_window_grace})

parameters:
- id: samp_rate
  label: Sample Rate
  dtype: float
  default: samp_rate
- id: pilot_offset_hz
  label: OTA Pilot Offset (Hz)
  dtype: float
  default: 50e3
- id: pilot_bandwidth_hz
  label: OTA Pilot Low-Pass Bandwidth (Hz)
  dtype: float
  default: 10e3
- id: settling_samples
  label: Startup Settling Samples
  dtype: int
  default: 65536
- id: estimation_samples
  label: CFO Estimation Samples
  dtype: int
  default: 262144
- id: validation_settling_samples
  label: Post-Correction Settling Samples
  dtype: int
  default: 65536
- id: residual_tolerance_hz
  label: Maximum Residual CFO Before Lock (Hz)
  dtype: float
  default: 1.0
- id: max_refinement_rounds
  label: Maximum Residual Refinement Rounds
  dtype: int
  default: 3
- id: retry_delay_samples
  label: Samples Before Retrying Rejection
  dtype: int
  default: 1048576
- id: agreement_tolerance_hz
  label: Estimate Agreement Tolerance (Hz)
  dtype: float
  default: 10.0
- id: max_abs_cfo_hz
  label: Maximum Absolute CFO (Hz)
  dtype: float
  default: 20000.0
- id: min_coherence
  label: Minimum Pilot Coherence
  dtype: float
  default: 0.90
- id: tracking_window_samples
  label: Continuous Tracking Window Samples
  dtype: int
  default: 16384
- id: tracking_phase_gain
  label: Tracking Phase-Restoration Gain
  dtype: float
  default: 0.25
- id: phase_jump_threshold_rad
  label: Reacquire Phase-Jump Threshold (rad)
  dtype: float
  default: 2.0
- id: tracking_bad_window_grace
  label: Invalid Tracking Windows Before Reacquire
  dtype: int
  default: 1

asserts:
- ${ samp_rate > 0.0 }
- ${ pilot_bandwidth_hz > 0.0 }
- ${ abs(pilot_offset_hz) + pilot_bandwidth_hz < samp_rate / 2.0 }
- ${ settling_samples >= 0 }
- ${ estimation_samples >= 2 }
- ${ validation_settling_samples >= 0 }
- ${ residual_tolerance_hz >= 0.0 }
- ${ max_refinement_rounds >= 1 }
- ${ retry_delay_samples >= 0 }
- ${ agreement_tolerance_hz >= 0.0 }
- ${ max_abs_cfo_hz > 0.0 and max_abs_cfo_hz < samp_rate / 2.0 }
- ${ min_coherence >= 0.0 and min_coherence <= 1.0 }
- ${ tracking_window_samples >= 64 }
- ${ tracking_phase_gain >= 0.0 and tracking_phase_gain <= 1.0 }
- ${ phase_jump_threshold_rad > 0.0 and phase_jump_threshold_rad <= 3.141592653589793 }
- ${ tracking_bad_window_grace >= 0 }

inputs:
- label: array
  domain: stream
  dtype: complex
  multiplicity: 4

outputs:
- label: corrected
  domain: stream
  dtype: complex
  multiplicity: 4

documentation: |-
  Automatic OTA pilot CFO correction for two dual-channel LibreSDRs.

  Fixed channel order: ch0 Alpha RX1 reference, ch1 Alpha RX2, ch2 Bravo RX2,
  ch3 Bravo RX1. Alpha passes through unchanged. A streaming complex mixer and
  low-pass filter isolate the configured positive-frequency OTA pilot so other
  raw-spectrum tones cannot bias the fit. The block independently fits the
  ch2/ch0 and ch3/ch0 pilot phase slopes, checks coherence, maximum CFO, and
  agreement, then applies their average provisionally. It measures the
  remaining post-correction phase slopes from both Bravo channels and refines the
  one shared correction until both residuals agree and their average is within
  residual_tolerance_hz. It then continues measuring short pilot windows and
  updates the correction frequency. A low-gain phase servo holds the arbitrary
  phase captured at lock; it never drives Alpha-vs-Bravo phase to zero. The common
  rotator is phase-continuous across scheduler calls and updates, preserving
  Bravo's internal phase relationship.

  Before the coarse estimate, all channels pass through unmodified. Provisional
  correction affects both Bravo outputs during residual validation, but no lock
  tag is emitted. After validation the block emits cfo_locked on the first sample
  using the tracked correction. A downstream UCA OTA Pilot Calibration block can
  require that tag so it never estimates phase from uncorrected, provisional, or
  rejected data. Constant phase offsets are intentionally retained for that
  downstream phase calibration. One invalid tracking window is tolerated so a
  mixed window at a coherent SDR frequency-state transition does not repeatedly
  disarm calibration. A following coherent common phase slope updates the shared
  correction without moving the captured phase reference or emitting an unlock
  tag. A common phase jump without a matching slope change, a differential phase
  jump, or persistent loss of coherence/disagreement emits cfo_unlocked and starts
  a phase-continuous reacquisition. Every successful reacquisition emits a new
  cfo_locked tag so downstream calibration can restart.

  Rejected windows do not stop the flowgraph or emit cfo_locked. The block waits
  retry_delay_samples, prints detailed finite/non-zero sample statistics, and
  automatically collects another complete estimation window.

file_format: 1
