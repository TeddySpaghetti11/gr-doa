id: doa_cross_sdr_cfo_corrector
label: Cross-SDR Continuous CFO Corrector
category: '[doa]'

templates:
  imports: from gnuradio import doa
  make: |-
    doa.continuous_cross_sdr_cfo_corrector(
        samp_rate=${samp_rate},
        pilot_offset_hz=${pilot_offset_hz},
        pilot_bandwidth_hz=${pilot_bandwidth_hz},
        settling_samples=${settling_samples},
        estimation_samples=${estimation_samples},
        validation_settling_samples=${validation_settling_samples},
        residual_tolerance_hz=${residual_tolerance_hz},
        max_refinement_rounds=${max_refinement_rounds},
        retry_delay_samples=${retry_delay_samples},
        agreement_tolerance_hz=${agreement_tolerance_hz},
        max_abs_cfo_hz=${max_abs_cfo_hz},
        min_coherence=${min_coherence},
        tracking_window_samples=${tracking_window_samples},
        tracking_warmup_samples=${tracking_warmup_samples},
        tracking_lock_tolerance_hz=${tracking_lock_tolerance_hz},
        tracking_agreement_tolerance_hz=${tracking_agreement_tolerance_hz},
        tracking_max_residual_hz=${tracking_max_residual_hz},
        tracking_gain=${tracking_gain},
        tracking_lock_windows=${tracking_lock_windows},
        tracking_min_coherence=${tracking_min_coherence})

parameters:
- id: samp_rate
  label: Sample Rate
  dtype: float
  default: samp_rate
- id: pilot_offset_hz
  label: OTA Pilot Offset (Hz)
  dtype: float
  default: 50e3
- id: pilot_bandwidth_hz
  label: OTA Pilot Low-Pass Bandwidth (Hz)
  dtype: float
  default: 10e3
- id: settling_samples
  label: Startup Settling Samples
  dtype: int
  default: 65536
- id: estimation_samples
  label: CFO Acquisition Samples
  dtype: int
  default: 262144
- id: validation_settling_samples
  label: Post-Correction Settling Samples
  dtype: int
  default: 65536
- id: residual_tolerance_hz
  label: Acquisition Residual CFO Tolerance (Hz)
  dtype: float
  default: 1.0
- id: max_refinement_rounds
  label: Maximum Acquisition Refinement Rounds
  dtype: int
  default: 3
- id: retry_delay_samples
  label: Samples Before Retrying Rejection
  dtype: int
  default: 1048576
- id: agreement_tolerance_hz
  label: Acquisition Estimate Agreement (Hz)
  dtype: float
  default: 10.0
- id: max_abs_cfo_hz
  label: Maximum Absolute CFO (Hz)
  dtype: float
  default: 20000.0
- id: min_coherence
  label: Acquisition Minimum Pilot Coherence
  dtype: float
  default: 0.90
- id: tracking_window_samples
  label: Continuous Tracking Window Samples
  dtype: int
  default: 262144
- id: tracking_warmup_samples
  label: Tracking Filter Warm-up Samples
  dtype: int
  default: 4096
- id: tracking_lock_tolerance_hz
  label: Continuous Lock Residual Tolerance (Hz)
  dtype: float
  default: 0.05
- id: tracking_agreement_tolerance_hz
  label: Tracking Estimate Agreement (Hz)
  dtype: float
  default: 0.25
- id: tracking_max_residual_hz
  label: Maximum Trackable Residual CFO (Hz)
  dtype: float
  default: 20.0
- id: tracking_gain
  label: Tracking Frequency Update Gain
  dtype: float
  default: 1.0
- id: tracking_lock_windows
  label: Stable Windows Before cfo_locked
  dtype: int
  default: 2
- id: tracking_min_coherence
  label: Tracking Minimum Pilot Coherence
  dtype: float
  default: 0.90

asserts:
- ${ samp_rate > 0.0 }
- ${ pilot_bandwidth_hz > 0.0 }
- ${ abs(pilot_offset_hz) + pilot_bandwidth_hz < samp_rate / 2.0 }
- ${ settling_samples >= 0 }
- ${ estimation_samples >= 2 }
- ${ validation_settling_samples >= 0 }
- ${ residual_tolerance_hz >= 0.0 }
- ${ max_refinement_rounds >= 1 }
- ${ retry_delay_samples >= 0 }
- ${ agreement_tolerance_hz >= 0.0 }
- ${ max_abs_cfo_hz > 0.0 and max_abs_cfo_hz < samp_rate / 2.0 }
- ${ min_coherence >= 0.0 and min_coherence <= 1.0 }
- ${ tracking_window_samples >= 64 }
- ${ tracking_warmup_samples >= 0 }
- ${ tracking_lock_tolerance_hz >= 0.0 }
- ${ tracking_agreement_tolerance_hz >= 0.0 }
- ${ tracking_max_residual_hz > 0.0 and tracking_max_residual_hz < samp_rate / 2.0 }
- ${ tracking_gain > 0.0 and tracking_gain <= 1.0 }
- ${ tracking_lock_windows >= 1 }
- ${ tracking_min_coherence >= 0.0 and tracking_min_coherence <= 1.0 }

inputs:
- label: array
  domain: stream
  dtype: complex
  multiplicity: 4

outputs:
- label: corrected
  domain: stream
  dtype: complex
  multiplicity: 4

documentation: |-
  Continuous OTA-pilot CFO correction for two dual-channel LibreSDRs.

  Fixed channel order: ch0 Alpha RX1 reference, ch1 Alpha RX2, ch2 Bravo RX2,
  ch3 Bravo RX1. Alpha passes through unchanged and one common, phase-continuous
  rotator is always applied to both Bravo channels.

  The block first performs the existing coarse pilot CFO fit and residual
  refinement. Unlike the former implementation, it does not freeze after that
  acquisition. It keeps filtering the configured pilot, independently measures
  the ch2/ch0 and ch3/ch0 residual phase slopes, checks their coherence and
  agreement, and continuously updates the common Bravo correction frequency.
  Only frequency/phase slope is corrected; absolute Alpha-vs-Bravo phase is not
  forced to zero, so the downstream OTA phase calibration still sees the fixed
  hardware and array geometry phase that it must calibrate.

  The cfo_locked tag is withheld until tracking_lock_windows consecutive
  tracking windows are within tracking_lock_tolerance_hz. Tracking remains
  active after the tag, so a small changing residual CFO cannot accumulate into
  the continuous phase ramp seen with the old frozen correction.

file_format: 1
