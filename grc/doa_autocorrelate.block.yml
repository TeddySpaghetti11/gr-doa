id: doa_autocorrelate
label: Autocorrelate
category: '[doa]'

templates:
  imports: from gnuradio import doa
  make: doa.autocorrelate(${inputs}, ${snapshot_size}, ${overlap_size}, ${avg_method.val}, ${valid_tag_key}, ${invalid_tag_key}, ${output_valid_tag_key})

parameters:
- id: inputs
  label: Num Inputs
  dtype: int
  default: 1
- id: snapshot_size
  label: Snapshot Size
  dtype: int
  default: 2048
- id: overlap_size
  label: Overlap Size
  dtype: int
  default: 512
- id: avg_method
  label: Averaging Method
  dtype: enum
  default: 'Forward'
  options: ['Forward', 'Forward-Backward']
  option_attributes:
    val: [0, 1]
- id: valid_tag_key
  label: Calibration Valid Tag
  dtype: string
  default: ""
- id: invalid_tag_key
  label: Calibration Invalid Tag
  dtype: string
  default: ""
- id: output_valid_tag_key
  label: Output Validity Tag
  dtype: string
  default: doa_valid

inputs:
- label: in
  domain: stream
  dtype: complex
  multiplicity: ${inputs}

outputs:
- label: out
  domain: stream
  dtype: complex
  vlen: ${inputs*inputs}
 
asserts:
- ${ inputs > 0 }
- ${ snapshot_size > 0 }
- ${ overlap_size < snapshot_size }
- ${ not (valid_tag_key or invalid_tag_key) or overlap_size == 0 }

documentation: |-
  This block generates a sample correlation matrix for the input vector comprised of values drawn from the receive channels. 
  Args:
    inputs: Number of inputs to the block
    snapshot_size: Determines num. of samples used to compute the sample correlation matrix
    overlap_size: Overlap size between snapshots
    avg_method: Use either standard forward-averaging method or a forward-backward averaging method to compute the sample correlation matrix.
    valid_tag_key/invalid_tag_key: Optional stream tags that gate complete snapshots. A snapshot crossing either boundary is emitted as an invalid zero matrix.
    output_valid_tag_key: Boolean tag attached to every output matrix when validity gating is enabled.

file_format: 1
